<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Folder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 340px;
      padding: 16px;
      background: #f9f9f9;
      color: #222;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: "📁";
      font-size: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #4a90e2;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: #4a90e2;
      color: #fff;
      width: 100%;
      padding: 9px;
    }

    .btn-primary:hover {
      background: #357abd;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-browse {
      background: #fff;
      color: #4a90e2;
      border: 1.5px solid #4a90e2;
      padding: 8px 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-browse:hover {
      background: #eaf2fb;
    }

    .btn-browse:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .history-label {
      font-size: 11px;
      font-weight: 500;
      color: #888;
      margin: 12px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-list {
      list-style: none;
      max-height: 130px;
      overflow-y: auto;
    }

    .history-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      color: #333;
      gap: 6px;
    }

    .history-list li:hover {
      background: #e8f0fb;
    }

    .history-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-remove {
      color: #bbb;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .history-remove:hover {
      color: #e55;
    }

    #status {
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    #status.success {
      background: #e6f4ea;
      color: #2e7d32;
      display: block;
    }

    #status.error {
      background: #fdecea;
      color: #c62828;
      display: block;
    }

    .empty-history {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      padding: 6px 0;
    }
  </style>
</head>
<body>
  <h1>Open Folder</h1>

  <label for="folderPath">Folder Path</label>
  <div class="input-row">
    <input type="text" id="folderPath" placeholder="C:\Users\You\Documents" autocomplete="off" />
    <button class="btn btn-browse" id="browseBtn" title="Browse for folder">Browse</button>
  </div>

  <button class="btn btn-primary" id="openBtn">Open in Explorer</button>

  <div id="status"></div>

  <div id="historySection" style="display:none;">
    <div class="history-label">Recent</div>
    <ul class="history-list" id="historyList"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
